name: ejecutar notebook con salidas

on:
  push:
    paths:
      - '.github/workflows/ejecutar-notebook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: pip install --quiet nbconvert ipykernel pandas matplotlib
      - name: Cabecera para el reclutador
        run: |
          python - <<'PY'
          import nbformat
          from nbformat.v4 import new_markdown_cell

          RUTA = 'Online_Retail_Analysis.ipynb'
          TEXTO = '[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Nicolenki7/Online-Retail-Business-Analysis/blob/main/Online_Retail_Analysis.ipynb)\n\n> **En 30 segundos:** el 24 % de los clientes aporta el 72 % del ingreso, y 117 clientes valiosos llevan 90 días sin comprar.\n>\n> - 4.338 clientes segmentados por RFM\n> - Clientes Leales: 1.050 (24,2 % de la base) generan el 71,8 % del gasto\n> - «No se pueden perder»: 117 clientes, 395.254 de gasto histórico, 90 días de recencia media\n>\n> Los resultados ya están ejecutados: no hace falta correr nada para leerlos.'

          nb = nbformat.read(RUTA, as_version=4)
          primero = ''.join(nb.cells[0].source) if nb.cells else ''
          if 'En 30 segundos' not in primero:
              nb.cells.insert(0, new_markdown_cell(TEXTO))
              nbformat.write(nb, RUTA)
              print('cabecera insertada')
          else:
              print('cabecera ya presente')
          PY
      - name: Ejecutar
        run: jupyter nbconvert --to notebook --execute --inplace "Online_Retail_Analysis.ipynb" --ExecutePreprocessor.timeout=900
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Online_Retail_Analysis.ipynb"
          git commit -m "chore: notebook ejecutado con salidas guardadas" || echo "sin cambios"
          git push
